# Temporary read-only diagnostic: reveals why the npm OIDC token exchange for
# @opencraft-app/opencraft fails during release.yml publish. Mints the same
# OIDC token the publish job uses, decodes its public claims, and posts the
# same exchange request. It prints no tokens: raw tokens are masked and a
# successful exchange response is reduced to a boolean. Remove after diagnosis.
name: OIDC publish probe

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: oidc-publish-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: npm-release
    steps:
      - name: Probe npm OIDC token exchange
        env:
          PACKAGE: '@opencraft-app/opencraft'
          AUDIENCE: 'npm:registry.npmjs.org'
          REGISTRY: 'https://registry.npmjs.org/'
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
          ID_TOKEN=$(printf '%s' "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          printf '::add-mask::%s\n' "$ID_TOKEN"
          echo "$ID_TOKEN" | cut -d. -f2 | python3 -c "
          import base64, json, sys
          payload = sys.stdin.read().strip()
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ('sub', 'aud', 'repository', 'repository_owner', 'repository_visibility',
                      'workflow', 'workflow_path', 'ref', 'ref_name', 'environment', 'actor', 'event_name'):
              print(f'{key}: {claims.get(key)!r}')
          "
          ESCAPED=$(node -p "encodeURIComponent(process.env.PACKAGE)")
          URL="$REGISTRY/-/npm/v1/oidc/token/exchange/package/$ESCAPED"
          STATUS=$(printf '' | curl --silent --show-error --output /tmp/exchange.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $ID_TOKEN" --url "$URL")
          echo "exchange HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            python3 -c "import json; d=json.load(open('/tmp/exchange.json')); assert isinstance(d, dict); print('exchange succeeded; npm publish token received:', bool(d.get('token')))"
          else
            echo 'exchange failed; registry response body:'
            cat /tmp/exchange.json; echo
          fi