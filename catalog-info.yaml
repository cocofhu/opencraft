{
  "id": "opencraft",
  "name": "OpenCraft Agent Workbench",
  "kind": "application",
  "path": "opencraft",
  "owner": "opencraft-app/maintainers",
  "lifecycle": "active",
  "domains": ["agent-gateway-runtime", "identity-access", "site-environment-routing"],
  "summary": "维护 Chat Runtime、Web/Expo/Electron Workbench 和 AppServer 适配层。",
  "runtime": "TypeScript、React 19、Vite、Expo、Electron、Node.js",
  "interfaces": ["Workbench Web", "Expo native app", "Electron desktop", "AppServer protocol", "extension runtime"],
  "dependencies": ["agent-runtime", "service-gateway", "identity"],
  "source_docs": ["opencraft/README.md", "opencraft/AGENTS.md", "opencraft/UPSTREAM_HISTORY.md"],
  "agent_entry": "opencraft/AGENTS.md",
  "service_docs": "opencraft/docs/README.md",
  "deploy": ["opencraft/config/build-matrix.json", "opencraft/scripts/publish-workbench-web.mjs"],
  "generated_paths": ["opencraft/apps/*/dist*"]
}
